<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8-表單-CRUD練習</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/allcss.css">

    <style>
        @media screen and (max-width: 768px) {
            .table-rwd thead {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
                border: 2px solid var(--border-soft);
                margin-top: 15px;
                border-radius: 5px;
            }

            .table-rwd tbody tr td {
                display: block;
                overflow: hidden;
            }

            .table-rwd tbody tr td::before {
                content: attr(data-th) " : ";
                font-size: 20px;
                font-weight: 900;
                display: block;
                float: left;
                width: 30%;
                text-align: right;
                padding-right: 15px;
                color: var(--text-primary);
            }

            .table-rwd tbody tr td span {
                display: block;
                float: left;
                width: 70%;
                font-size: 18px
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-tertiary bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CRUD練習</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="practice_form_CRUD-C.html">產品建檔</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="practice_form_CRUD-R.html">產品列表</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card mt-4">
                    <div class="card-header text-info h1 text-center">產品列表</div>
                    <div class="card-body">
                        <table class="table table-bordered table-rwd">
                            <thead class="table-dark">
                                <tr>
                                    <th width="20%">產品名稱</th>
                                    <th width="20%">產品價格</th>
                                    <th width="20%">產品數量</th>
                                    <th width="20%">產品分類</th>
                                    <th width="20%">產品備註</th>
                                </tr>
                            </thead>
                            <tbody id="mytbody">
                                <tr>
                                    <td data-th="產品名稱"><span></span></td>
                                    <td data-th="產品價格"><span></span></td>
                                    <td data-th="產品數量"><span></span></td>
                                    <td data-th="產品分類"><span></span></td>
                                    <td data-th="產品備註"><span></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        $(function () {
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/product",
                dataType: "json",
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "讀取失敗",
                        text: "無法連接後端API",
                        icon: "error"
                    });
                }
            });
        });

        function showdata(data) {
            $("#mytbody").empty();
            data.forEach(function (item) {
                const strHTML = `
                    <tr>
                        <td data-th="產品名稱"><span>${item.name}</span></td>
                        <td data-th="產品價格"><span>${item.price}</span></td>
                        <td data-th="產品數量"><span>${item.num}</span></td>
                        <td data-th="產品分類"><span>${item.category}</span></td>
                        <td data-th="產品備註"><span>${item.remark}</span></td>
                    </tr>
                `;
                $("#mytbody").append(strHTML);
            });
        }

    </script>

</body>

</html>
