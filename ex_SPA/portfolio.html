<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/portfolio.css">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .imgbox {
            height: 220px;
        }

        .timeline-section {
            position: relative;
        }

        .timeline-section::before {
            position: absolute;
            content: "";
            width: 5px;
            background-color: rgba(72, 218, 67, 0.5);
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .timeline-section-pointer {
            position: relative;
        }

        .timeline-section-pointer::before {
            position: absolute;
            content: "";
            width: 20px;
            height: 20px;
            background-color: rgba(104, 199, 101, 0.8);
            border-radius: 50%;
            border: 5px solid rgba(12, 121, 9, 0.8);
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }

        @media screen and (max-width: 768px) {
            .timeline-section::before {
                left: -20px;
            }

            .timeline-section-pointer::before {
                left: -8px;
            }
        }
    </style>
</head>

<body>
    <section id="s12" aria-labelledby="timeline-title">
        <div class="container my-5">
            <h2 id="timeline-title" class="portfolio-section-title text-center mb-2">學習歷程與作品</h2>
            <div class="row timeline-head text-center">
                <div class="col-md-6">
                    <h3 class="timeline-side-label h5">學習</h3>
                </div>
                <div class="col-md-6">
                    <h3 class="timeline-side-label timeline-side-label--work h5">作品</h3>
                </div>
            </div>
            <!-- AJAX 讀取資料後，依月份動態新增區塊 -->
            <div id="timeline-list" aria-live="polite"></div>
        </div>
    </section>


    <!-- Section 13：期望待遇 -->
    <section id="s13">
        <div class="container-fluid">
            <div class="h1 text-center portfolio-section-title">
                期望待遇／<small>Compensation</small>
            </div>

            <div class="windmill">

                <!-- 左上：薪資待遇 -->
                <div class="blade blade-01 bg-img-center">
                    <div class="box">
                        <div class="h3">薪資待遇</div>
                        <ul>
                            <li>期望薪資依職務內容面議</li>
                            <li>重視合理的薪資調整制度</li>
                            <li>期待明確的績效獎勵機制</li>
                        </ul>
                    </div>
                </div>

                <!-- 右上：工作環境 -->
                <div class="blade blade-02 bg-img-center">
                    <div class="box">
                        <div class="h3">工作環境</div>
                        <p>
                            希望擁有良好的團隊溝通氛圍，
                            明確的工作分工與協作流程，
                            能夠互相交流並持續精進專業能力。
                        </p>
                    </div>
                </div>

                <!-- 左下：公司福利 -->
                <div class="blade blade-03 bg-img-center">
                    <div class="box">
                        <div class="h3">公司福利</div>
                        <ul>
                            <li>完善的基本福利制度</li>
                            <li>教育訓練及進修資源</li>
                            <li>重視工作與生活平衡</li>
                        </ul>
                    </div>
                </div>

                <!-- 右下：升遷機會 -->
                <div class="blade blade-04 bg-img-center">
                    <div class="box">
                        <div class="h3">升遷機會</div>
                        <p>
                            期待透過實際專案累積經驗，
                            持續提升技術能力，
                            並在具備明確成長制度的環境中穩定發展。
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <!-- Section 14：精選作品 -->
    <section id="s14">
        <div class="container py-5">

            <!-- 區塊標題 -->
            <div class="text-center portfolio-section-title mb-4">
                精選作品
            </div>

            <!-- 四個分類按鈕 -->
            <div class="row g-3 mb-4">

                <div class="col-6 col-lg-3">
                    <button type="button" class="btn work-btn w-100 active" data-category="interactive">
                        互動與資料串接
                    </button>
                </div>

                <div class="col-6 col-lg-3">
                    <button type="button" class="btn work-btn w-100" data-category="layout">
                        網頁設計與排版
                    </button>
                </div>

                <div class="col-6 col-lg-3">
                    <button type="button" class="btn work-btn w-100" data-category="figma">
                        UI / UX 規劃
                    </button>
                </div>

                <div class="col-6 col-lg-3">
                    <button type="button" class="btn work-btn w-100" data-category="backend">
                        後台系統與資料庫
                    </button>
                </div>

            </div>

            <!-- 分類資訊：不會隨圖片切換 -->
            <div class="work-info mb-4">

                <div class="work-info-top">

                    <!-- 分類名稱、技術 -->
                    <div>
                        <h3 id="work-title">互動與資料串接</h3>
                        <p id="work-tech"></p>
                    </div>

                    <!-- 作品連結由 JS 產生 -->
                    <div class="work-links"></div>

                </div>

                <!-- 分類說明 -->
                <p id="work-description"></p>

            </div>

            <!-- 共用 Bootstrap Carousel -->
            <div id="workCarousel" class="carousel slide" data-bs-interval="false">

                <!-- 圖片或影片由 JS 產生 -->
                <div class="carousel-inner"></div>

                <!-- 上一張 -->
                <button class="carousel-control-prev" type="button" data-bs-target="#workCarousel" data-bs-slide="prev">

                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>

                    <span class="visually-hidden">上一張</span>
                </button>

                <!-- 下一張 -->
                <button class="carousel-control-next" type="button" data-bs-target="#workCarousel" data-bs-slide="next">

                    <span class="carousel-control-next-icon" aria-hidden="true"></span>

                    <span class="visually-hidden">下一張</span>
                </button>

                <!-- 底部圓點由 JS 產生 -->
                <div class="carousel-indicators"></div>

            </div>

        </div>
    </section>


    <!-- Section 15：作品列表 -->
    <section id="S15">
        <div class="container">
            <div class="text-center portfolio-section-title">作品列表</div>

            <div class="row g-4">
                <!-- 左側：搜尋條件 -->
                <div class="col-md-6">
                    <div class="s15-search-panel">

                        <!-- 關鍵字搜尋 -->
                        <div class="mb-4">
                            <label for="keyword" class="form-label s15-label">
                                關鍵字搜尋
                            </label>

                            <div class="s15-input-box">
                                <input type="text" class="form-control" id="keyword" placeholder="輸入使用技術或作品名稱">

                                <i class="fa-solid fa-magnifying-glass"></i>
                            </div>
                        </div>


                        <!-- 技術類別 -->
                        <div class="mb-4">
                            <div class="s15-label">技術類別</div>

                            <div id="technical" class="s15-filter-group">
                                <button type="button" class="s15-filter-btn active" data-value="全部">全部</button>
                                <button type="button" class="s15-filter-btn" data-value="HTML/CSS">HTML/CSS</button>
                                <button type="button" class="s15-filter-btn"
                                    data-value="JavaScript/jQuery">JavaScript/jQuery</button>
                                <button type="button" class="s15-filter-btn" data-value="Bootstrap">Bootstrap</button>
                                <button type="button" class="s15-filter-btn" data-value="AJAX/JSON">AJAX/JSON</button>
                                <button type="button" class="s15-filter-btn"
                                    data-value="PHP/Laravel">PHP/Laravel</button>
                                <button type="button" class="s15-filter-btn" data-value="Figma">Figma</button>
                            </div>
                        </div>


                        <!-- 成品類別 -->
                        <div class="mb-3">
                            <div class="s15-label">成品類別</div>

                            <div id="product" class="s15-filter-group">
                                <button type="button" class="s15-filter-btn active" data-value="全部">全部</button>
                                <button type="button" class="s15-filter-btn" data-value="學習">學習</button>
                                <button type="button" class="s15-filter-btn" data-value="作品">作品</button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 右側：搜尋結果 -->
                <div class="col-md-6">
                    <div class="s15-label">
                        搜尋結果
                        <span id="result-count" class="s15-count"></span>
                    </div>

                    <div id="result" class="s15-result-list">
                        <!-- AJAX 自動產生作品 -->
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/jquery-4.0.0.js"></script>
    <script src="../js/carousel.js"></script>
    <script>
        $(function () {
            // 先把外部文字編碼，避免 JSON 的 title/note 被當成 HTML 語法執行。
            function escapeHTML(value) {
                return $("<div>").text(String(value == null ? "" : value)).html();
            }

            // 將網址限制為站內的相對檔案路徑（支援空白、中文、括號）。
            function safeUrl(value) {
                let url = String(value == null ? "" : value).trim();
                if (!url || /^(\/|#|[a-z][a-z0-9+.-]*:)/i.test(url) || /[\\\x00-\x1f]/.test(url)) return "";
                if (url.split("/").includes("..")) return "";
                return url;
            }

            // 將 20261015 取出 202610 作為月份群組識別，畫面只顯示「10月份」。
            function monthKey(date) {
                let value = String(date == null ? "" : date).trim();
                return /^\d{8}$/.test(value) ? value.substring(0, 6) : "";
            }

            // 產生一筆時間軸內容。
            function makeTimelineItem(item) {
                let isWork = item.class === "作品";
                let direction = isWork ? "flex-md-row-reverse" : "";
                let typeClass = isWork ? "timeline-item--work" : "timeline-item--learning";
                let typeName = isWork ? "作品" : "學習";
                let title = escapeHTML(item.title || "未命名成品");
                let note = String(item.note == null ? "" : item.note).trim();
                let noteHTML = note ? escapeHTML(note) : '<span class="timeline-note-empty">（無文字說明）</span>';
                let url = safeUrl(item.url);
                let related = safeUrl(item.related);
                let actions = "";

                // 一般項目：一個按鈕。related 非空且不同於 url：兩個按鈕。
                // related 指向原始練習時，對照按鈕標成「AI 前 / AI 後」。
                // 未來若 related 是非 AI 關聯作品，可修改為「目前版本 / 關聯版本」。
                if (url) {
                    let label = related && related !== url ? "AI 後" : "查看成果";
                    actions += `<a class="portfolio-action" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
                }
                if (related && related !== url) {
                    actions += `<a class="portfolio-action portfolio-action--outline" href="${escapeHTML(related)}" target="_blank" rel="noopener noreferrer">AI 前</a>`;
                }
                if (!actions) actions = '<span class="timeline-note-empty">（尚無連結）</span>';

                return `
                <div class="row align-items-start timeline-item ${typeClass} ${direction}">
                    <div class="col-md-6">
                        <div class="timeline-item-content">
                            <span class="timeline-type">${typeName}</span>
                            <h4 class="timeline-item-title">${title}</h4>
                            <p class="timeline-item-note">${noteHTML}</p>
                            <div class="timeline-item-actions">${actions}</div>
                        </div>
                    </div>
                    <div class="col-md-6"></div>
                </div>`;
            }

            $.ajax({
                type: "GET",
                url: "../index_content.json",  // 路徑以正式首頁所在資料夾為基準
                dataType: "json",
                success: function (data) {
                    if (!data || !Array.isArray(data.projects)) {
                        $("#timeline-list").text("作品資料格式有誤。");
                        return;
                    }

                    // 只接受有效分類與 YYYYMMDD 日期，並由舊到新排序。
                    let projects = data.projects.filter(function (item) {
                        return (item.class === "學習" || item.class === "作品") && monthKey(item.date);
                    });
                    projects.sort(function (a, b) {
                        return String(a.date).localeCompare(String(b.date));
                    });

                    let currentMonth = "";
                    let html = "";
                    projects.forEach(function (item) {
                        let month = monthKey(item.date);
                        if (month !== currentMonth) {
                            if (currentMonth !== "") html += '</div></div></div>';
                            // 月份區塊不按時間比例切割，只用不同淡底色分段。
                            let monthText = Number(month.substring(4, 6)) + "月份";
                            html += `<div class="timeline-month"><div class="container">
                                     <h3 class="timeline-month-name">${monthText}</h3>
                                     <div class="timeline-month-body">`;
                            currentMonth = month;
                        }
                        html += makeTimelineItem(item);
                    });
                    if (currentMonth !== "") html += '</div></div></div>';
                    $("#timeline-list").html(html || '<p class="timeline-empty">目前沒有學習或作品資料。</p>');
                },
                error: function () {
                    $("#timeline-list").text("讀取 index_content.json 失敗，請確認路徑並透過 Live Server 開啟。");
                }
            });


            // 點擊分類按鈕
            $("#s14 .work-btn").on("click", function () {

                // 取得目前按鈕的分類
                let category = $(this).data("category");

                // 移除所有按鈕的 active
                $("#s14 .work-btn").removeClass("active");

                // 讓目前點擊的按鈕加上 active
                $(this).addClass("active");

                // 隱藏所有作品分類
                $("#s14 .work-group").addClass("d-none");

                // 顯示被選取的分類
                $('#s14 .work-group[data-category="' + category + '"]')
                    .removeClass("d-none");

            });


            // s15


            let projects = [];
            let selectedTechnical = "全部";
            let selectedProduct = "全部";

            // 1. AJAX 讀取 JSON 資料
            $.ajax({
                url: "../index_content.json",
                method: "GET",
                dataType: "json",

                success: function (data) {
                    projects = data.projects;
                    renderResults(projects);
                },

                error: function () {
                    $("#result").html(
                        '<div class="s15-empty">資料載入失敗，請檢查 JSON 路徑。</div>'
                    );
                }
            });

            // 2. 將 category 統一轉成陣列
            function getCategories(item) {
                if (Array.isArray(item.category)) {
                    return item.category;
                }

                if (item.category) {
                    return [item.category];
                }

                return [];
            }

            // 3. 顯示搜尋結果
            function renderResults(list) {

                $("#result").empty();
                $("#result-count").text(`共 ${list.length} 筆`);

                if (list.length === 0) {
                    $("#result").html(
                        '<div class="s15-empty">找不到符合條件的作品。</div>'
                    );
                    return;
                }

                list.forEach(function (item) {

                    // 建立作品卡片
                    let card = $('<div class="s15-result-card"></div>');

                    // 作品名稱
                    let title = $('<div class="s15-result-title"></div>');
                    title.text(item.title);

                    // 作品說明
                    let note = $('<div class="s15-result-note"></div>');
                    note.text(item.note || "尚無說明");

                    // 技術標籤
                    let tags = $('<div class="s15-tags"></div>');

                    getCategories(item).forEach(function (category) {
                        let tag = $('<span class="s15-tag"></span>');
                        tag.text(category);
                        tags.append(tag);
                    });

                    // 學習或作品
                    let productClass = $('<span class="s15-class"></span>');
                    productClass.text(item.class);
                    tags.append(productClass);

                    // 加入卡片
                    card.append(title, note, tags);

                    // 查看作品連結
                    if (item.url) {
                        let link = $('<a class="s15-result-link"></a>');

                        link.text("查看作品 ↗");
                        link.attr("href", "../" + item.url);
                        link.attr("target", "_blank");
                        link.attr("rel", "noopener noreferrer");

                        card.append(link);
                    }

                    $("#result").append(card);
                });
            }

            // 4. 篩選資料
            function filterProjects() {

                let keyword = $("#keyword").val().trim().toLowerCase();

                let filtered = projects.filter(function (item) {

                    let categories = getCategories(item);

                    // 關鍵字搜尋模式
                    if (keyword !== "") {
                        let searchText = [
                            item.title,
                            item.note,
                            item.class,
                            ...categories
                        ].join(" ").toLowerCase();

                        return searchText.includes(keyword);
                    }

                    // 分類篩選模式
                    let matchTechnical =
                        selectedTechnical === "全部" ||
                        categories.includes(selectedTechnical);

                    let matchProduct =
                        selectedProduct === "全部" ||
                        item.class === selectedProduct;

                    return matchTechnical && matchProduct;
                });

                renderResults(filtered);
            }

            // 5. 關鍵字搜尋
            $("#keyword").on("input", function () {

                // 輸入搜尋時，清除分類條件
                selectedTechnical = "全部";
                selectedProduct = "全部";

                // 按鈕恢復全部
                resetButtons();

                filterProjects();
            });

            // 6. 技術分類按鈕
            $("#technical .s15-filter-btn").on("click", function () {

                selectedTechnical = $(this).data("value");

                // 清除關鍵字
                $("#keyword").val("");

                // 同組只能選一個
                $("#technical .s15-filter-btn").removeClass("active");
                $(this).addClass("active");

                filterProjects();
            });

            // 7. 成品分類按鈕
            $("#product .s15-filter-btn").on("click", function () {

                selectedProduct = $(this).data("value");

                $("#keyword").val("");

                $("#product .s15-filter-btn").removeClass("active");
                $(this).addClass("active");

                filterProjects();
            });

            // 8. 重設分類按鈕
            function resetButtons() {

                $(".s15-filter-btn").removeClass("active");

                $("#technical .s15-filter-btn")
                    .first().addClass("active");

                $("#product .s15-filter-btn")
                    .first().addClass("active");
            }


        });

    </script>



    <script src="../js/wow.js"></script>
    <script>
        new WOW().init();
    </script>

</body>

</html>
